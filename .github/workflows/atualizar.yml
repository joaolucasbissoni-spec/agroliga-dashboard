name: Atualizar cotações

on:
  schedule:
    # Seg-sex, 21:30 UTC (18:30 em Brasília), depois do fechamento da CBOT.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recarregar 1 ano de histórico (use na primeira vez)"
        type: boolean
        default: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: python atualizar.py
